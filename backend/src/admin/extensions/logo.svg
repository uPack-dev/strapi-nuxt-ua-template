<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="0 0 64 64"
  fill="none"
>
  <title>Strapi favicon with Ukrainian flag</title>

  <defs>
    <clipPath id="icon-clip">
      <rect x="4" y="4" width="56" height="56" rx="12"/>
    </clipPath>

    <filter id="soft-symbol-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="0.9"
        stdDeviation="0.9"
        flood-color="#1E1B4B"
        flood-opacity="0.28"
      />
    </filter>
  </defs>

  <!-- Rounded rectangle as Ukrainian flag -->
  <g clip-path="url(#icon-clip)">
    <rect x="4" y="4" width="56" height="28" fill="#0057B8"/>
    <rect x="4" y="32" width="56" height="28" fill="#FFD700"/>

    <!-- Very subtle overlay to make the flag less flat and closer to app-icon style -->
    <rect x="4" y="4" width="56" height="56" fill="#000000" opacity="0.025"/>
  </g>

  <!-- Soft outer outline -->
  <rect
    x="4.5"
    y="4.5"
    width="55"
    height="55"
    rx="11.5"
    stroke="#000000"
    stroke-opacity="0.08"
  />

  <!-- Original Strapi monogram geometry -->
  <g transform="translate(12.7 13) scale(0.15)" filter="url(#soft-symbol-shadow)">
    <path
      d="M249.868148,1.42108547e-14 L81.6129672,1.42108547e-14 L81.6129672,84.3619834 L164.402564,84.3619834 C167.35201,84.3619834 169.744773,86.7547464 169.744773,89.7041929 L169.744773,171.351123 L255.210366,171.351123 L255.210366,5.3519758 C255.212951,3.93344238 254.651257,2.57212016 253.649118,1.56814827 C252.646978,0.56417638 251.286684,1.42108547e-14 249.868148,1.42108547e-14 Z"
      fill="#FFFFFF"
    />

    <path
      d="M81.6032009,0 L81.6032009,84.3619834 L2.67132424,84.3619834 C1.58669272,84.3600599 0.610497706,83.7036101 0.199569944,82.6998335 C-0.211357818,81.6960568 0.0242672254,80.5435101 0.796179436,79.7815516 L81.6032009,0 L81.6032009,0 Z M174.295906,251.220572 C173.527464,251.975341 172.381399,252.195816 171.387771,251.780027 C170.394142,251.364238 169.746654,250.393242 169.744773,249.316128 L169.744773,171.351123 L255.210357,171.351123 L174.295906,251.210806 L174.295906,251.220572 L174.295906,251.220572 Z"
      fill="#FFFFFF"
      opacity="0.405"
    />

    <path
      d="M81.6032009,84.3619834 L167.078552,84.3619834 C168.543508,84.3619834 169.744773,85.5534817 169.744773,87.028205 L169.744773,171.351123 L86.9551767,171.351123 C84.0047559,171.351123 81.6129672,168.959334 81.6129672,166.008913 L81.6129672,84.3619834 L81.6032009,84.3619834 L81.6032009,84.3619834 Z"
